name: Build HandFont Creator APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Provision Gradle (bootstraps this repo's ./gradlew)
        run: |
          if [ ! -x "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandFontCreator-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare Signing and Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks
            export KEYSTORE_PATH="/tmp/release.jks"
            ./gradlew assembleRelease --stacktrace
            rm -f /tmp/release.jks
          else
            echo "No KEYSTORE_BASE64 secret provided. Building unsigned release APK..."
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandFontCreator-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
